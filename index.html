<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script>
      if (
        localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>Dog</title>
  </head>
  <body>
    <div id="header"></div>
    <div id="hero"></div>
    <div id="breeds"></div>
    <div id="gallery"></div>
    <div id="footer"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      function loadComponent(path, id) {
        fetch(path)
          .then((res) => res.text())
          .then((text) => {
            const doc = new DOMParser().parseFromString(text, "text/html");
            document.getElementById(id).innerHTML = doc.body.innerHTML;
            lucide.createIcons();
          });
      }

      loadComponent("./components/header.html", "header");
      loadComponent("./components/hero.html", "hero");
      loadComponent("./components/breeds.html", "breeds");
      loadComponent("./components/gallery.html", "gallery");
      loadComponent("./components/footer.html", "footer");

      document.addEventListener("click", (e) => {
        const sunBtn = e.target.closest("#sun-btn");
        const moonBtn = e.target.closest("#moon-btn");
        const backToTopBtn = e.target.closest("#back-to-top-btn");

        if (sunBtn) {
          document.documentElement.classList.add("dark");
          localStorage.setItem("theme", "dark");
        }

        if (moonBtn) {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("theme", "light");
        }

        if (backToTopBtn) {
          window.scrollTo({
            top: 0,
            behavior: "smooth",
          });
        }
      });
    </script>
    <script src="./components/hero.js"></script>
    <script src="./components/breeds.js"></script>
    <script src="./components/gallery.js"></script>
  </body>
</html>
