<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
  </head>
  <body>
    <div
      class="w-[390px] xl:w-[1280px] mx-auto bg-[rgba(246,251,245,0.9)] font-[Plus Jakarta Sans] py-8 px-6"
    >
      <div
        class="flex items-center uppercase font-medium text-[11px] leading-[14px] tracking-normal text-[#8D4B00] gap-[6px] mb-1"
      >
        <i
          data-lucide="sparkles"
          width="10"
          height="16"
          stroke-width="2"
          color="#8D4B00"
        ></i
        >community snaps
      </div>
      <h2 class="font-semibold text-[26px] leading-[34px] text-[#181D1A]">
        More Dogs to Love
      </h2>
      <p
        class="font-normal text-[14px] leading-[20px] tracking-normal text-[#554336] mt-1 mb-5"
      >
        A lively collection of everyday wagging tails, sweet snouts, and happy
        smiles.
      </p>
      <div class="flex gap-3 mb-8">
        <div class="flex flex-col gap-3">
          <div
            class="relative w-[165px] h-[220px] shadow-[0_1px_2px_rgba(0,0,0,0.05)]"
          >
            <div class="absolute inset-0">
              <img
                src="../assets/sunny.jpg"
                alt="dog"
                class="w-full h-full object-cover"
              />
            </div>
            <div
              class="capitalize font-medium text-[11px] leading-[14px] tracking-normal text-white absolute left-[10px] bottom-[10px]"
            >
              garden sprinter
            </div>
          </div>
          <div
            class="relative w-[165px] h-[165px] shadow-[0_1px_2px_rgba(0,0,0,0.05)]"
          >
            <div class="absolute inset-0">
              <img
                src="../assets/sunny.jpg"
                alt="dog"
                class="w-full h-full object-cover"
              />
            </div>
            <div
              class="capitalize font-medium text-[11px] leading-[14px] tracking-normal text-white absolute left-[10px] bottom-[10px]"
            >
              curious mio
            </div>
          </div>
        </div>
        <div class="flex flex-col gap-3">
          <div
            class="relative w-[165px] h-[165px] shadow-[0_1px_2px_rgba(0,0,0,0.05)]"
          >
            <div class="absolute inset-0">
              <img
                src="../assets/sunny.jpg"
                alt="dog"
                class="w-full h-full object-cover"
              />
            </div>
            <div
              class="capitalize font-medium text-[11px] leading-[14px] tracking-normal text-white absolute left-[10px] bottom-[10px]"
            >
              sunny golden
            </div>
          </div>
          <div
            class="relative w-[165px] h-[220px] shadow-[0_1px_2px_rgba(0,0,0,0.05)]"
          >
            <div class="absolute inset-0">
              <img
                src="../assets/sunny.jpg"
                alt="dog"
                class="w-full h-full object-cover"
              />
            </div>
            <div
              class="capitalize font-medium text-[11px] leading-[14px] tracking-normal text-white absolute left-[10px] bottom-[10px]"
            >
              sunny path
            </div>
          </div>
        </div>
      </div>
      <button
        class="capitalize font-medium text-[14px] leading-[20px] tracking-normal text-[#8D4B00] flex items-center justify-center mx-auto gap-2 bg-white py-[14px] px-6 rounded-3xl shadow-[0_4px_16px_rgba(64,40,20,0.06)]"
      >
        <i
          data-lucide="paw-print"
          width="16"
          height="16"
          stroke-width="2"
          color="#8D4B00"
        ></i
        >show more pups
      </button>
    </div>
  </body>
</html>
