<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer</title>
  </head>
  <body>
    <div
      class="w-[390px] mx-auto bg-[rgba(249,249,249,0.9)] flex px-[50px] py-[10px] justify-between items-center shadow-[0_-4px_20px_#4028140F] backdrop-blur-sm"
    >
      <div
        class="flex flex-col justify-center items-center text-[#8D4B00] font-medium text-[11px] leading-[14px] tracking-normal"
      >
        <i
          data-lucide="compass"
          width="20"
          height="20"
          stroke-width="2"
          color="#887364"
        ></i
        >Discover
      </div>
      <div
        class="flex flex-col justify-center items-center text-[#8D4B00] font-medium text-[11px] leading-[14px] tracking-normal"
      >
        <i
          data-lucide="paw-print"
          width="20"
          height="20"
          stroke-width="2"
          color="#887364"
        ></i
        >Breeds
      </div>
      <div
        class="flex flex-col justify-center items-center text-[#8D4B00] font-medium text-[11px] leading-[14px] tracking-normal"
      >
        <i
          data-lucide="images"
          width="20"
          height="20"
          stroke-width="2"
          color="#887364"
        ></i
        >Gallery
      </div>
    </div>
  </body>
</html>
