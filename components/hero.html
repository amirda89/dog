<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hero</title>
  </head>
  <body>
    <div
      class="w-[390px] mx-auto px-[24px] pt-[20px] bg-[#F6FBF6] shadow-[0px_12px_32px_0px_rgba(64,40,20,0.08)] xl:w-[1280px]"
    >
      <!-- MOBILE -->
      <div class="xl:hidden">
        <div
          class="rounded-2xl w-[125px] uppercase bg-[#FFDCC1] font-[Plus Jakarta Sans] font-medium text-[11px] text-[#6C3A00] flex items-center justify-center py-[4px]"
        >
          🐾 daily joy feed
        </div>
        <div
          class="font-extrabold text-[32px] font-[Plus Jakarta Sans] pt-[12px]"
        >
          Meet a <span class="text-[#8D4B00]">New Friend</span>
        </div>
        <p
          class="font-[Plus Jakarta Sans] text-[#554336] text-[16px] leading-[24px] font-light pb-[20px]"
        >
          Discover dogs from around the world, one adorable face at a time.
        </p>
        <div class="rounded-3xl w-[342px] overflow-hidden bg-white">
          <div class="w-full bg-cover relative h-[384px] bg-center">
            <div id="heroImage" class="absolute inset-0 overflow-hidden">
              <!-- GENERATED -->
            </div>
            <div
              class="bg-[rgba(255,255,255,0.9)] px-[12px] py-[6px] font-[Plus Jakarta Sans] font-normal text-[12px] leading-[16px] tracking-normal w-[137px] rounded-2xl absolute top-[12px] left-[12px]"
            >
              🐾 Golden Retriever
            </div>
            <div
              class="absolute bottom-0 left-0 w-[342px] h-[150px] bg-[linear-gradient(0deg,rgba(24,29,26,0.8)_0%,rgba(24,29,26,0.4)_50%,rgba(24,29,26,0)_100%)]"
            >
              <div class="flex w-[310px] mx-auto mt-[64px]">
                <div>
                  <div class="flex gap-[8px] items-center">
                    <h3
                      class="font-[Plus Jakarta Sans] font-semibold text-[22px] leading-[27px] tracking-normal text-white"
                    >
                      Sunny Cooper
                    </h3>
                    <div
                      class="rounded-2xl bg-[#FC9D3D] text-[#6A3900] font-[Plus Jakarta Sans] text-[11px] leading-none flex items-center px-[8px] py-[2px] h-[18px]"
                    >
                      2yrs
                    </div>
                  </div>
                  <p
                    class="font-[Plus Jakarta Sans] font-normal text-[14px] leading-[20px] tracking-normal text-[rgba(223,228,223,0.9)]"
                  >
                    Always enthusiastic, tennis ball aficionado & puddle seeker.
                  </p>
                </div>
                <div class="flex items-end">
                  <div
                    class="px-[10px] py-[4px] flex gap-[4px] font-[Plus Jakarta Sans] font-bold text-[11px] leading-[14px] tracking-normal text-white bg-[rgba(255,255,255,0.2)] rounded-2xl"
                  >
                    <i
                      data-lucide="circle-star"
                      width="15"
                      height="15"
                      stroke-width="2"
                      color="#FFDCC1"
                    ></i>
                    Pawsome
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div>
            <div class="flex gap-[10px] w-[310px] mx-auto mt-[16px]">
              <button
                class="w-[150px] font-[Plus Jakarta Sans] font-medium text-[14px] leading-[20px] tracking-normal bg-[#8D4B00] text-white rounded-3xl flex items-center justify-center py-[3px] px-[16px] shadow-[0px_4px_14px_0px_rgba(141,75,0,0.25)]"
              >
                <i
                  data-lucide="shuffle"
                  width="13"
                  height="13"
                  stroke-width="2"
                  color="white"
                ></i>
                <p class="px-[15px] w-[90px]">Show Another</p>
              </button>
              <button
                class="w-[150px] font-[Plus Jakarta Sans] rounded-3xl bg-[#FFDCC1] py-[13px] px-[16px] flex items-center gap-[6px] font-medium text-[14px] leading-[20px] text-[#2E1500] justify-center"
              >
                <i
                  data-lucide="paw-print"
                  width="16"
                  height="16"
                  color="#2E1500"
                  stroke-width="4"
                ></i>
                Breeds
              </button>
            </div>
            <div class="flex gap-[8px] mt-[18px] mb-[16px] justify-center">
              <div
                class="w-[98px] h-[52px] bg-[#F0F5F0] font-[Plus Jakarta Sans] font-normal text-[#554336] text-center text-[12px] flex justify-center flex-col"
              >
                <div class="font-semibold text-[#8D4B00]">10 / 10</div>
                Firendliness
              </div>
              <div
                class="w-[98px] h-[52px] bg-[#F0F5F0] font-[Plus Jakarta Sans] font-normal text-[#554336] text-center text-[12px] flex justify-center flex-col"
              >
                <div class="font-semibold text-[#8D4B00]">Vibrant</div>
                Energy
              </div>
              <div
                class="w-[98px] h-[52px] bg-[#F0F5F0] font-[Plus Jakarta Sans] font-normal text-[#554336] text-center text-[12px] flex justify-center flex-col"
              >
                <div class="font-semibold text-[#8D4B00]">Infinite</div>
                Cuddles
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- DESKTOP -->
      <div class="flex">
        <div>
          <div
            class="flex items-center gap-[8px] font-[Plus Jakarta Sans] font-medium text-[12px] leading-[16px] tracking-normal text-[#2E1500] px-[16px] py-[6px] bg-[#FFDCC1] rounded-2xl shadow-sm"
          >
            <i
              data-lucide="paw-print"
              width="13"
              height="13"
              color="#2E1500"
              stroke-width="4"
            ></i
            >Daily Joy Feed
          </div>
        </div>
        <div></div>
      </div>
    </div>
    <script src="./hero.js"></script>
  </body>
</html>
